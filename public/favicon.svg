<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c162e" />
      <stop offset="60%" stop-color="#0f0b1a" />
      <stop offset="100%" stop-color="#06040d" />
    </radialGradient>

    <!-- Gold Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#E5B54E" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>

    <!-- Red Ribbon Gradient -->
    <linearGradient id="redRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="100%" stop-color="#D90429" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#FF2E56" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base with Gold Accent Border -->
  <rect x="24" y="24" width="464" height="464" rx="124" fill="url(#bgGlow)" stroke="url(#goldBorder)" stroke-width="22" />

  <!-- StoryHub Signature Stylized S-Ribbon -->
  <g filter="url(#glow)">
    <!-- Top Red Loop with integrated Play Triangle -->
    <path d="M 335 155 C 310 130, 230 120, 195 175 C 160 230, 235 258, 275 278 C 320 300, 335 340, 310 380 C 275 435, 180 395, 180 395" 
          stroke="url(#redRibbon)" stroke-width="50" stroke-linecap="round" fill="none" />
    
    <!-- White Bottom Swoosh Accent -->
    <path d="M 285 345 C 300 365, 290 388, 260 400 C 220 415, 180 395, 180 395" 
          stroke="#FFFFFF" stroke-width="48" stroke-linecap="round" fill="none" />
    
    <!-- Play Triangle -->
    <polygon points="230,172 278,200 230,228" fill="#FFFFFF" />
  </g>
</svg>
